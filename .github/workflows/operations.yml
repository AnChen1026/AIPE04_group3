name: Operations quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: operations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ops-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.14.3
      - run: ruff check scripts/ops tests/ops
      - run: ruff format --check scripts/ops tests/ops
