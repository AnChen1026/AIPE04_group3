name: Database and backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: aipe04_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d aipe04_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test_user:test_password@127.0.0.1:5432/aipe04_test
      TEST_DATABASE_URL: postgresql+psycopg://test_user:test_password@127.0.0.1:5432/aipe04_test
      SESSION_SECRET_KEY: ci-only-session-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r backend/requirements.txt
      - name: Upgrade empty database
        run: alembic upgrade head
      - name: Migration and API regressions
        run: python -m pytest tests -q
      - name: Confirm final database revision
        run: alembic current
