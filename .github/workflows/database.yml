name: Database and backend

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: aipe04_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d aipe04_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test_user:test_password@127.0.0.1:5432/aipe04_test
      TEST_DATABASE_URL: postgresql+psycopg://test_user:test_password@127.0.0.1:5432/aipe04_test
      SESSION_SECRET_KEY: ci-only-session-key
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r backend/requirements.txt
      - name: Install maintenance dependencies when present
        run: |
          if [ -f scripts/ops/requirements.txt ]; then
            python -m pip install -r scripts/ops/requirements.txt
          fi
      - name: Upgrade empty database
        run: alembic -c backend/alembic.ini upgrade head
      - name: Migration and API regressions
        run: python -m pytest tests -q
      - name: Confirm final database revision
        run: alembic -c backend/alembic.ini current
