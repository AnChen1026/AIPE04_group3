{% extends "base.html" %}

{% block title %}首頁｜音樂教學平台測試{% endblock %}

{% block content %}
<section class="card">
    <h1>音樂教學平台測試首頁</h1>
    <p>目前可測試老師／學生註冊、登入與角色分流。</p>

    {% if user %}
        <p>目前登入角色：{{ user.role }}</p>
        <div class="actions">
            {% if user.role == "teacher" %}
                <a class="button" href="/teacher">進入老師頁面</a>
            {% else %}
                <a class="button" href="/student">進入學生頁面</a>
            {% endif %}
            <a class="button secondary" href="/profile">基本資料</a>
        </div>
    {% else %}
        <div class="actions">
            <a class="button" href="/login">登入</a>
            <a class="button secondary" href="/register">註冊</a>
        </div>
    {% endif %}
</section>
{% endblock %}
