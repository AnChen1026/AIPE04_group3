
services:
  python-env:
    build: . # 自動讀取旁邊的新版 Dockerfile 進行現地打包與套件安裝
    container_name: python-dev-box # 固定容器名稱
    ports:
      - "8000:8000" # 💡 全新加入：將容器內的 8000 通訊埠（FastAPI 預設）映射到本機電腦的 8000 埠
    volumes:
      - .:/app # 核心傳送門：開發者目前的 Git 資料夾 ＝ 容器內的 /app
    command: sleep infinity # 核心發呆指令：維持開機，方便開發者一邊用 Cursor 改扣、一邊手動測試
