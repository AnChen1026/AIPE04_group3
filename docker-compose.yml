services:

  # 1. 後端fastapi 服務
  backend:
    build:
      context: ./backend # 後端 Dockerfile 與 requirements.txt 位於 backend/
      dockerfile: Dockerfile # 自動讀取新版 Dockerfile 進行現地打包與套件安裝
    container_name: python-dev-box # 固定容器名稱
    working_dir: /app
    ports:
      - "8000:8000" # 💡 全新加入：將容器內的 8000 通訊埠（FastAPI 預設）映射到本機電腦的 8000 埠
    volumes:
      - ./backend:/app/backend # 和映像裡的 /app/backend 是同一個位置
      - ./uploads:/app/uploads
    environment:
      PYTHONPATH: /app
      # 容器內 localhost 是後端自己。這裡覆寫 .env，改連同一個 compose 裡的 postgres。
      DATABASE_URL: postgresql+psycopg://aipe04:aipe04@postgres:5432/aipe04
    command: sh -c "alembic -c backend/alembic.ini upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload" # 先自動升級資料庫結構，再啟動 Uvicorn 服務
    depends_on:
      postgres:
        condition: service_healthy # 確保資料庫「健康檢查通過」後端才啟動
    env_file:
      - .env # 自動讀取外層的 .env 環境變數
    networks:
      - app-network
    # #  日誌大小限制
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "10m" # 每個日誌檔案上限 10 Megabytes
    #     max-file: "3" # 最多保留 3 個檔案，舊的自動覆蓋


    # 2. Vue 前端服務 (使用 Vite 打包)
  frontend:
    build:
      context: ./frontend # 告訴 Docker 去 ./frontend 資料夾找 Dockerfile
      dockerfile: Dockerfile
    container_name: vue-dev-box
    ports:
      - "80:80" # 將本機的 80 埠對應到容器內 Nginx 的 80 埠
    restart: always
    depends_on:
      - backend
    networks:
      - app-network
    # # 日誌大小限制
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "10m"
    #     max-file: "3"


  postgres:
    image: postgres:17
    container_name: aipe04-postgres
    environment:
      POSTGRES_USER: aipe04
      POSTGRES_PASSWORD: aipe04
      POSTGRES_DB: aipe04
    ports:
      - "5432:5432"
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    networks:
      - app-network
    # 每 5 秒檢查一次資料庫是不是真的活著
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aipe04 -d aipe04" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres17_data:

networks:
  app-network:
    driver: bridge
