services:

  # 1. 後端fastapi 服務
  backend:
    build:
      context: ./backend # 後端 Dockerfile 與 requirements.txt 位於 backend/
      dockerfile: Dockerfile # 自動讀取新版 Dockerfile 進行現地打包與套件安裝
    container_name: python-dev-box # 固定容器名稱
    working_dir: /app
    ports:
      - "127.0.0.1:8000:8000" # 容器內的 8000 埠（FastAPI）只開給本機，其他電腦連不到
    volumes:
      - ./backend:/app/backend # 和映像裡的 /app/backend 是同一個位置
      - ./uploads:/app/uploads
    environment:
      PYTHONPATH: /app
      # 容器內 localhost 是後端自己。這裡覆寫 .env，改連同一個 compose 裡的 postgres。
      # 帳密讀 .env 的 POSTGRES_*，缺少時 compose 會直接報錯停止
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?請在 .env 設定 POSTGRES_USER}:${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?請在 .env 設定 POSTGRES_DB}
    command: sh -c "alembic -c backend/alembic.ini upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload" # 先自動升級資料庫結構，再啟動 Uvicorn 服務
    depends_on:
      postgres:
        condition: service_healthy # 確保資料庫「健康檢查通過」後端才啟動
    env_file:
      - .env # 自動讀取外層的 .env 環境變數
    networks:
      - app-network
    restart: unless-stopped # 程式崩潰或 Docker 重開時自動重啟；手動 docker stop 的不會被叫回來
    # 每 30 秒在容器裡打一次 /health；資料庫連不上時 /health 回 503，連續 3 次失敗就標成 unhealthy
    # slim 映像沒有 curl，所以用 Python 內建的 urllib
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s # 啟動時要跑 migration、載入音訊套件，前 40 秒失敗不算
    # #  日誌大小限制
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "10m" # 每個日誌檔案上限 10 Megabytes
    #     max-file: "3" # 最多保留 3 個檔案，舊的自動覆蓋


    # 2. Vue 前端服務 (使用 Vite 打包)
  frontend:
    build:
      context: ./frontend # 告訴 Docker 去 ./frontend 資料夾找 Dockerfile
      dockerfile: Dockerfile
    container_name: vue-dev-box
    ports:
      - "80:80" # 將本機的 80 埠對應到容器內 Nginx 的 80 埠
    restart: always
    depends_on:
      backend:
        condition: service_healthy # 等後端健康檢查通過才啟動，避免 Nginx 找不到 backend 一直重啟
    networks:
      - app-network
    # # 日誌大小限制
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "10m"
    #     max-file: "3"


  postgres:
    image: postgres:17
    container_name: aipe04-postgres
    environment:
      # 讀 .env 的值，缺少時 compose 會直接報錯停止
      POSTGRES_USER: ${POSTGRES_USER:?請在 .env 設定 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?請在 .env 設定 POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432" # 只開給本機的資料庫工具與測試；本機 5432 已被電腦裝的 PostgreSQL 佔用，改用 5433。容器之間仍走 app-network 的 5432
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped # Docker 重開後自動把資料庫叫回來
    # 每 5 秒檢查一次資料庫是不是真的活著
    healthcheck:
      # $$ 讓 compose 不替換，交給容器裡的 shell 讀上面設定的環境變數
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres17_data:

networks:
  app-network:
    driver: bridge
